name: Supabase Anti-Sleep Ping

on:
  schedule:
    # Berjalan setiap 3 hari sekali pada jam 00:00 UTC
    - cron: '0 0 */3 * *'
  # Memungkinkan trigger manual lewat tab Actions di GitHub
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          curl -s -f "https://${{ secrets.VERCEL_DOMAIN }}/api/keep-alive?secret=${{ secrets.CRON_SECRET }}" || exit 1